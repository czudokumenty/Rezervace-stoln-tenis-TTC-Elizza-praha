<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTC Elizza Praha – rezervace veřejnosti</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #dee2e6;
            --available: #d1e7dd;
            --available-text: #0f5132;
            --occupied: #f8d7da;
            --occupied-text: #842029;
            --selected: #0d6efd;
            --selected-text: #ffffff;
            --non-res: #e2e3e5;
            --non-res-text: #41464b;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
            padding-bottom: 140px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            color: #1a252f;
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .header-title p {
            color: #6c757d;
            font-size: 0.95rem;
        }

        .admin-login-btn {
            background-color: #343a40;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .admin-login-btn:hover {
            background-color: #212529;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .date-picker-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-picker-group label {
            font-weight: 600;
        }

        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        .notice-badge {
            background-color: #fff3cd;
            color: #664d03;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid #ffe69c;
        }

        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .grid-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
        }

        .table-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .table-card h3 {
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            font-size: 1.05rem;
        }

        .slot-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slot-btn {
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .slot-btn.available {
            background-color: var(--available);
            color: var(--available-text);
        }

        .slot-btn.available:hover {
            filter: brightness(0.95);
        }

        .slot-btn.occupied {
            background-color: var(--occupied);
            color: var(--occupied-text);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .slot-btn.selected {
            background-color: var(--selected);
            color: var(--selected-text);
        }

        .non-reservable-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .non-reservable-card {
            background: var(--non-res);
            color: var(--non-res-text);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid #ced4da;
        }

        .non-reservable-card.occupied-onsite {
            background: var(--occupied);
            color: var(--occupied-text);
            border-color: #f5c2c7;
        }

        .non-reservable-card h4 {
            margin-bottom: 5px;
        }

        .admin-toggle-btn {
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: #495057;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .booking-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            padding: 15px;
            display: none;
            z-index: 100;
        }

        .booking-panel.active {
            display: block;
        }

        .booking-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .price-tag {
            color: #198754;
            font-weight: bold;
            font-size: 1.05rem;
            margin-top: 4px;
        }

        .booking-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .booking-form input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .btn-confirm {
            background-color: #198754;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .admin-section {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-top: 30px;
            border: 2px solid #343a40;
        }

        .admin-section.active {
            display: block;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .admin-table th, .admin-table td {
            padding: 10px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .admin-table th {
            background-color: #f1f3f5;
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>TTC Elizza Praha – rezervace veřejnosti</h1>
            <p>Rezervace stolů na stolní tenis | Ned
